<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Login</title>

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="https://i.imgur.com/Sv74lxN.png">
    <meta name="apple-mobile-web-app-status-bar" content="#0d6efd">
    <meta name="theme-color" content="#0d6efd">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0d1b2a; }

        /* Background slideshow (auto slide) */
        #bg-slideshow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            background: #0d1b2a;
        }
        #bg-slideshow .bg-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.3s ease-in-out;
        }
        #bg-slideshow .bg-slide.active { opacity: 1; }
        #bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: rgba(13, 27, 42, 0.6);
        }

        .signin-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card-signin {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem 0 rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

<div id="bg-slideshow"></div>
<div id="bg-overlay"></div>

<div class="container signin-container">
    <div class="card card-signin p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <img src="https://injourneyairports.id/assets/kawung-logo-side-CktPU2GK.png" alt="Injourne Airport Logo" class="mx-auto mb-4">
                <h3 class="fw-bold mt-2">AIRPORT PKU</h3>
                <p style="font-style: italic" class="text-muted">Airside Reporting and Operation Pekanbaru</p>
                <p class="text-muted">Silahkan masukan akun anda</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="Masukkan email" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary py-2 fw-bold" id="btnLogin">
                        <span id="btnText">Masuk</span>
                        <span id="btnLoading" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </div>
                
                <div id="alertMessage" class="mt-3"></div>
            </form>
        </div>
    </div>
</div>

<script>
    // --- BACKGROUND SLIDESHOW (AUTO SLIDE) ---
    const SLIDES = [
        'https://i.imgur.com/XmqXY6Y.jpeg',
        'https://i.imgur.com/Xs00VCg.jpeg',
        'https://i.imgur.com/LTLyX3N.jpeg',
        'https://i.imgur.com/ce9huuT.jpeg',
        'https://i.imgur.com/9WNXF1M.jpeg'
    ];

    (function () {
        const container = document.getElementById('bg-slideshow');
        if (!container) return;

        const slideEls = SLIDES.map((url, i) => {
            const div = document.createElement('div');
            div.className = 'bg-slide' + (i === 0 ? ' active' : '');
            div.style.backgroundImage = `url('${url}')`;
            container.appendChild(div);
            return div;
        });

        // Preload gambar agar perpindahan mulus
        SLIDES.forEach(url => { const img = new Image(); img.src = url; });

        let current = 0;
        setInterval(() => {
            const next = (current + 1) % slideEls.length;
            slideEls[current].classList.remove('active');
            slideEls[next].classList.add('active');
            current = next;
        }, 5000);
    })();
</script>

<script>
    // --- KONFIGURASI SUPABASE ---
    const supabaseUrl = 'https://voqvauapafsdcmuswsnq.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvcXZhdWFwYWZzZGNtdXN3c25xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxNDMxNTYsImV4cCI6MjA4MTcxOTE1Nn0.IJG7ofqfc4Qy44KlbTDGzo4OoQwO0xTXUwKPt04kRnI';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // --- LOGIC LOGIN ---
    const loginForm = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const btnText = document.getElementById('btnText');
    const btnLoading = document.getElementById('btnLoading');
    const alertMessage = document.getElementById('alertMessage');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Reset UI
        alertMessage.innerHTML = '';
        btnLogin.disabled = true;
        btnText.classList.add('d-none');
        btnLoading.classList.remove('d-none');

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) throw error;

            // Jika sukses, redirect ke dashboard
            window.location.href = 'dashboard.html';

        } catch (error) {
            alertMessage.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    Login Gagal: ${error.message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        } finally {
            btnLogin.disabled = false;
            btnText.classList.remove('d-none');
            btnLoading.classList.add('d-none');
        }
    });

    // Cek jika user sudah login, langsung lempar ke dashboard
    async function checkSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            window.location.href = 'dashboard.html';
        }
    }
    checkSession();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, err => {
          console.log('ServiceWorker registration failed: ', err);
        });
    });
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
